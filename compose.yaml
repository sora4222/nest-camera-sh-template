# PostgreSQL for the event log (`make db`). Listens on this machine only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: camwatch
      POSTGRES_PASSWORD: camwatch
      POSTGRES_DB: camwatch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - camwatch-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "camwatch"]
      interval: 2s
      retries: 15
    restart: unless-stopped

volumes:
  camwatch-db:
